version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    ignore:
      # odd Node majors never become LTS; stay on even (LTS) releases
      - dependency-name: "node"
        versions: ["25.x", "27.x", "29.x"]
