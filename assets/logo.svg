  <path d="M37.5 11.5 c2.6 -2.4 6.4 -1.6 6.5 1.3 c0.1 1.9 -2.1 2.5 -3.1 1.2" fill="none" stroke="#e8743a" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M26.5 11.5 c-2.6 -2.4 -6.4 -1.6 -6.5 1.3 c-0.1 1.9 2.1 2.5 3.1 1.2" fill="none" stroke="#e8743a" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M19 33 H45" stroke="#c45a24" stroke-width="1.6" stroke-linecap="round"/>
  <!-- doorway with hearth glow -->
